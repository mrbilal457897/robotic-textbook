name: Security Scan

on:
  push:
    branches: ["main", "develop", "*-rag-*"]
  pull_request:
    branches: ["main", "develop"]
  schedule:
    # Run daily at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  security-events: write

jobs:
  trufflehog-scan:
    name: Trufflehog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for comprehensive scan

      - name: Run Trufflehog scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --config=.trufflehog.yaml --only-verified

      - name: Upload scan results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-results
          path: trufflehog-results.json
          retention-days: 30

  api-key-verification:
    name: Verify No Client-Side API Keys
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          # Use dummy values for build
          NEXT_PUBLIC_API_URL: "https://example.com"

      - name: Scan built files for API keys
        run: |
          # Check if any API key environment variables are exposed in built files
          echo "Scanning for exposed API keys in frontend build..."

          # Patterns to search for (adjust as needed)
          PATTERNS=(
            "GEMINI_API_KEY"
            "OPENAI_API_KEY"
            "COHERE_API_KEY"
            "QDRANT_API_KEY"
            "NEON_DATABASE_URL"
            "UPSTASH_REDIS_URL"
            "SENTRY_DSN"
          )

          FOUND_KEYS=0

          for pattern in "${PATTERNS[@]}"; do
            if grep -r "$pattern" frontend/.next/ frontend/out/ 2>/dev/null | grep -v "NEXT_PUBLIC_"; then
              echo "❌ SECURITY VIOLATION: Found $pattern in client-side code!"
              FOUND_KEYS=1
            fi
          done

          if [ $FOUND_KEYS -eq 1 ]; then
            echo "❌ API keys found in client-side code. Please move sensitive keys to server-side only."
            exit 1
          else
            echo "✅ No exposed API keys found in client-side code."
          fi

      - name: Check for hardcoded secrets in source
        run: |
          echo "Checking source files for hardcoded secrets..."

          # Check for common secret patterns
          if grep -rE "(api[_-]?key|secret|password|token)\s*=\s*['\"][^'\"]{20,}" \
            --include="*.ts" \
            --include="*.tsx" \
            --include="*.js" \
            --include="*.jsx" \
            --exclude-dir=node_modules \
            --exclude-dir=.next \
            --exclude-dir=out \
            frontend/; then
            echo "❌ Potential hardcoded secrets found!"
            exit 1
          else
            echo "✅ No hardcoded secrets detected."
          fi

  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit frontend dependencies
        working-directory: ./frontend
        run: |
          npm audit --audit-level=moderate
          npm audit fix --dry-run

      - name: Audit backend dependencies
        working-directory: ./backend
        run: |
          pip install safety
          safety check --json || true
